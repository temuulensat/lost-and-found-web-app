<div class="nav-account">
  {% include '_language_switcher.html' %}
  {% if g.user %}
    <span class="username" title="{{ g.user['username'] }}">{{ g.user['username'] }}</span>
    <form class="logout-form" method="post" action="{{ url_for('auth.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit">{{ t('Log Out') }}</button>
    </form>
  {% else %}
    <a href="{{ url_for('auth.login') }}">{{ t('Log In') }}</a>
    <a href="{{ url_for('auth.signup') }}">{{ t('Sign Up') }}</a>
  {% endif %}
</div>
